<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rental Dashboard</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--sunk:#f3f3f0;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6d68;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);
  --series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;--series-hi:#1c5cab;
  --seq-1:#86b6ef;--seq-2:#5598e7;--seq-3:#2a78d6;--seq-4:#1c5cab;--seq-5:#104281;
  --div-b3:#1c5cab;--div-b2:#5598e7;--div-b1:#b7d3f6;--div-n:#d9d8d2;--div-r1:#f7c9c7;--div-r2:#ee8d8b;--div-r3:#cf3434;
  --good:#0ca30c;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;--good-text:#006300;--on-fill:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--sunk:#222221;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a09e97;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
  --series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;--series-hi:#9ec5f4;
  --seq-1:#184f95;--seq-2:#256abf;--seq-3:#3987e5;--seq-4:#6da7ec;--seq-5:#9ec5f4;
  --div-b3:#4a96ec;--div-b2:#2a6fc4;--div-b1:#234a78;--div-n:#383835;--div-r1:#7a3a39;--div-r2:#c04e4d;--div-r3:#e66767;
  --good-text:#0ca30c;--shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--sunk:#222221;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a09e97;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
  --series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;--series-hi:#9ec5f4;
  --seq-1:#184f95;--seq-2:#256abf;--seq-3:#3987e5;--seq-4:#6da7ec;--seq-5:#9ec5f4;
  --div-b3:#4a96ec;--div-b2:#2a6fc4;--div-b1:#234a78;--div-n:#383835;--div-r1:#7a3a39;--div-r2:#c04e4d;--div-r3:#e66767;
  --good-text:#0ca30c;--shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--series-1);outline-offset:2px}
.chrome{background:var(--surface);border-bottom:1px solid var(--grid)}
@media (min-width:900px){.chrome{position:sticky;top:0;z-index:30}}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px 16px}
.brand h1{margin:0;font-size:17px;letter-spacing:-.01em}
.brand .meta{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tab{padding:6px 12px;border:0;background:none;border-radius:8px;color:var(--ink2)}
.tab:hover{background:var(--sunk)}
.tab[aria-selected=true]{background:var(--ink);color:var(--surface)}
.tab small{opacity:.7;margin-left:4px}
.iconbtn{border:1px solid var(--grid);background:var(--surface);border-radius:8px;padding:5px 9px;color:var(--ink2)}
.iconbtn:hover{background:var(--sunk)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px 10px;border-top:1px solid var(--grid)}
.filters label{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px}
.filters input[type=search]{width:min(260px,100%)}
.filters input,.filters select{padding:5px 8px;border:1px solid var(--grid);border-radius:8px;background:var(--surface)}
.filters input[type=number]{width:84px}
.count{margin-left:auto;color:var(--muted);font-size:13px}
details.pop{position:relative}
details.pop>summary{list-style:none;cursor:pointer;padding:5px 10px;border:1px solid var(--grid);border-radius:8px;color:var(--ink2);font-size:13px;background:var(--surface)}
details.pop>summary::-webkit-details-marker{display:none}
details.pop[open]>summary{background:var(--sunk)}
details.pop .menu{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:240px;max-height:60vh;overflow:auto;padding:10px;background:var(--surface);border:1px solid var(--grid);border-radius:10px;box-shadow:var(--shadow);display:grid;gap:4px}
.menu label{justify-content:space-between;width:100%}
.menu .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;border:1px solid var(--grid);background:var(--surface);color:var(--ink2);font-size:12px;white-space:nowrap}
.chip.kw{background:var(--sunk)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
main{padding:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start}
.listhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{border:1px solid var(--grid);background:var(--surface);padding:4px 10px;color:var(--ink2)}
.seg:first-of-type{border-radius:8px 0 0 8px}.seg:last-of-type{border-radius:0 8px 8px 0;border-left:0}
.seg[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:var(--axis)}
.card.sel{outline:2px solid var(--series-1);outline-offset:-2px}
.card.dim{opacity:.55}
.thumb{position:relative;aspect-ratio:4/3;background:var(--sunk);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{display:grid;place-items:center;height:100%;color:var(--muted);font-size:12px}
.badge{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;box-shadow:var(--shadow);border:1px solid var(--grid)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--div-n);flex:none}
.dot.b3{background:var(--div-b3)}.dot.b2{background:var(--div-b2)}.dot.b1{background:var(--div-b1)}.dot.n{background:var(--div-n)}.dot.r1{background:var(--div-r1)}.dot.r2{background:var(--div-r2)}.dot.r3{background:var(--div-r3)}
.dot.ring{box-shadow:inset 0 0 0 1px var(--axis)}
.toprow{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0}
.badge.static,.star.static{position:static;box-shadow:none}
.star{position:absolute;right:6px;top:6px;border:0;background:var(--surface);border-radius:999px;width:30px;height:30px;line-height:30px;text-align:center;box-shadow:var(--shadow);color:var(--ink2);padding:0}
.star[aria-pressed=true]{color:#d99a00}
.cbody{padding:10px 12px 12px;display:grid;gap:4px}
.price{font-size:20px;font-weight:700;letter-spacing:-.01em}
.price .per{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}
.facts,.where{color:var(--ink2);font-size:13px}
.where{color:var(--muted)}
.warnrow{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2)}
table.t{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--grid);border-radius:12px;overflow:hidden;font-size:13px}
.t th,.t td{padding:6px 10px;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap}
.t th{background:var(--sunk);color:var(--ink2);font-weight:600;position:sticky;top:0}
.t th.sortable{cursor:pointer;user-select:none}
.t td.num,.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.t tbody tr{cursor:pointer}.t tbody tr:hover{background:var(--sunk)}.t tr.sel{background:var(--sunk);box-shadow:inset 3px 0 0 var(--series-1)}
.t img{width:56px;height:42px;object-fit:cover;border-radius:6px;display:block;background:var(--sunk)}
.tw{overflow-x:auto;border-radius:12px}
.detail{position:sticky;top:var(--chrome-h,120px);max-height:calc(100vh - var(--chrome-h,120px) - 16px);overflow:auto;background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:0}
.detail .pad{padding:14px 16px}
.dhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dhead h2{margin:0;font-size:16px;line-height:1.3}
.dprice{font-size:26px;font-weight:700;letter-spacing:-.02em}
.gallery{background:var(--sunk);position:relative}
.gallery .main{aspect-ratio:4/3;width:100%;object-fit:cover;display:block;cursor:zoom-in}
.gallery .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:var(--surface);width:34px;height:34px;border-radius:50%;box-shadow:var(--shadow)}
.gallery .prev{left:8px}.gallery .next{right:8px}
.gallery .count{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:1px 9px;font-size:12px;margin:0}
.strip{display:flex;gap:4px;overflow-x:auto;padding:6px}
.strip img{width:64px;height:48px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.7;flex:none}
.strip img.on{opacity:1;outline:2px solid var(--series-1)}
.sec{border-top:1px solid var(--grid);padding:12px 16px}
.sec h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
dl.facts2{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
dl.facts2 dt{color:var(--muted)}dl.facts2 dd{margin:0}
.desc{white-space:pre-wrap;max-height:240px;overflow:auto;background:var(--sunk);padding:10px;border-radius:8px;font-size:13px}
.desc.full{max-height:none}
mark{background:color-mix(in srgb,var(--series-1) 25%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--grid);background:var(--surface);border-radius:8px;padding:5px 10px;color:var(--ink2);text-decoration:none;display:inline-block;font-size:13px}
.btn:hover{background:var(--sunk)}
.btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
textarea.note{width:100%;min-height:70px;border:1px solid var(--grid);border-radius:8px;background:var(--surface);padding:8px;resize:vertical}
.flag{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.flag .ic{flex:none;width:20px;text-align:center;font-weight:700}
.flag.serious .ic{color:var(--critical)}.flag.warn .ic{color:#b35900}.flag.info .ic{color:var(--ink2)}
.flag b{font-weight:600}
.flag p{margin:0;color:var(--ink2);font-size:13px}
.muted{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.cc{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:14px 16px 10px;min-width:0}
.cc.wide{grid-column:1/-1}
.cc header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.cc h2{margin:0;font-size:14px}.cc .sub{margin:2px 0 0;color:var(--muted);font-size:12px}
.cc .vt{display:flex;flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:12px 14px}
.tile .l{color:var(--muted);font-size:12px}.tile .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:2px 0}.tile .s{color:var(--muted);font-size:12px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg text{font-family:inherit;fill:var(--ink2);font-size:11px}
svg .tick{fill:var(--muted)}
svg .lab{fill:var(--ink)}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .axis{stroke:var(--axis);stroke-width:1}
svg .hit{fill:transparent}
svg .bar{fill:var(--series-1)}
svg .bar.hi{fill:var(--series-hi)}
svg .pt{stroke:var(--surface);stroke-width:2}
svg .ringsel{fill:none;stroke:var(--ink);stroke-width:2}
svg .hover-ring{fill:none;stroke:var(--ink);stroke-width:1.5;pointer-events:none}
svg .line{fill:none;stroke:var(--series-1);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .ref{stroke:var(--ink2);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.segbar{display:flex;height:28px;gap:2px;margin:8px 0}
.segbar div{border-radius:4px;color:var(--on-fill);font-size:12px;display:flex;align-items:center;padding-left:8px;white-space:nowrap}
.list{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.list li{display:flex;gap:10px;justify-content:space-between;padding:5px 6px;border-radius:6px;cursor:pointer}
.list li:hover{background:var(--sunk)}
.theme{border:1px solid var(--grid);border-radius:10px;padding:10px 12px}
.themes{display:grid;gap:10px}
.notice{background:var(--sunk);border-radius:8px;padding:8px 12px;color:var(--ink2);font-size:13px;margin:6px 0}
.empty{padding:40px;text-align:center;color:var(--muted)}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:8px;padding:6px 10px;box-shadow:var(--shadow);font-size:12px;max-width:260px}
#tip b{font-size:13px}#tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}#tip .r span:last-child{color:var(--ink);font-weight:600}
#lightbox,#help{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:20px}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
#help .box{background:var(--surface);border-radius:12px;padding:18px 22px;max-width:420px;width:100%}
#help h2{margin:0 0 10px}
#help dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
kbd{background:var(--sunk);border:1px solid var(--grid);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:12px ui-monospace,monospace}
.closebtn{display:none}
@media (max-width:1000px){
  .split{grid-template-columns:minmax(0,1fr)}
  .detail{position:fixed;inset:0;z-index:60;max-height:none;border-radius:0;display:none}
  .detail.open{display:block}
  .closebtn{display:inline-block}
  .tabs{margin-left:0}
}
@media (max-width:520px){.cards{grid-template-columns:1fr}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
</style>
</head>
<body>
<noscript>This dashboard needs JavaScript.</noscript>
<div class="chrome" id="chrome">
  <div class="top">
    <div class="brand"><h1>Rental Dashboard</h1><div class="meta" id="meta"></div></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">◐</button>
    <button class="iconbtn" id="helpbtn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
  </div>
  <section class="filters" id="filters" aria-label="Filters"></section>
</div>
<main id="main"></main>
<div id="tip" role="tooltip" hidden></div>
<div id="lightbox" hidden></div>
<div id="help" hidden></div>
<script>
'use strict';
const DATA = /*__DATA__*/null;
(function () {
const L = DATA.listings, META = DATA.meta, MODEL = DATA.model;
const byId = new Map(L.map((r) => [r.id, r]));
const HAS_PHOTOS = L.some((r) => r.photos.length > 0); // newer snapshots have none: the layout drops the picture areas
const $ = (sel, el = document) => el.querySelector(sel);

// ------------------------------------------------------------------ DOM helpers (all text via textContent)
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k.startsWith('aria-') && typeof v === 'boolean') { e.setAttribute(k, String(v)); continue; }
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs || {}) { const v = attrs[k]; if (v == null || v === false) continue; if (k === 'text') e.textContent = v; else if (k === 'fill' && String(v).startsWith('var(')) e.style.fill = v; else e.setAttribute(k, v); }
  for (const c of kids.flat(Infinity)) if (c) e.append(c);
  return e;
}
const put = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false));
const money = (n) => (n == null || isNaN(n) ? '—' : '$' + Math.round(n).toLocaleString('en-US'));
const signed = (n, suf = '') => (n > 0 ? '+' : n < 0 ? '−' : '') + (suf === '$' ? '$' : '') + Math.abs(Math.round(n)).toLocaleString('en-US') + (suf === '$' ? '' : suf);
const fold = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
L.forEach((r) => { r._hay = fold([r.title, r.desc, r.amenities.join(' '), r.named.join(' '), r.area, r.postal, r.address].join(' ')); });

// ------------------------------------------------------------------ stats
const clean = (a) => a.filter((x) => x != null && !isNaN(x));
function median(a) { const b = clean(a).sort((x, y) => x - y), n = b.length; return n ? (n % 2 ? b[(n - 1) / 2] : (b[n / 2 - 1] + b[n / 2]) / 2) : null; }
function ranks(a) { const idx = a.map((v, i) => [v, i]).sort((x, y) => x[0] - y[0]); const r = new Array(a.length); for (let i = 0; i < idx.length;) { let j = i; while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++; for (let k = i; k <= j; k++) r[idx[k][1]] = (i + j) / 2 + 1; i = j + 1; } return r; }
function pearson(x, y) { const n = x.length; if (n < 3) return null; const mx = x.reduce((a, b) => a + b, 0) / n, my = y.reduce((a, b) => a + b, 0) / n; let sxy = 0, sxx = 0, syy = 0; for (let i = 0; i < n; i++) { sxy += (x[i] - mx) * (y[i] - my); sxx += (x[i] - mx) ** 2; syy += (y[i] - my) ** 2; } return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null; }
function spearman(x, y) { return x.length < 3 ? null : pearson(ranks(x), ranks(y)); }
function ols(x, y) { const n = x.length; if (n < 3) return null; const mx = x.reduce((a, b) => a + b, 0) / n, my = y.reduce((a, b) => a + b, 0) / n; let sxy = 0, sxx = 0; for (let i = 0; i < n; i++) { sxy += (x[i] - mx) * (y[i] - my); sxx += (x[i] - mx) ** 2; } if (!sxx) return null; const slope = sxy / sxx; return { slope, intercept: my - slope * mx, r: pearson(x, y) }; }
function niceTicks(lo, hi, n = 5) { const span = hi - lo || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0)), norm = step0 / mag, step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag; const out = []; for (let v = Math.floor(lo / step) * step; v <= hi + step * 0.5; v += step) out.push(+v.toFixed(10)); return out; }
const lin = (d0, d1, r0, r1) => (v) => (d1 === d0 ? (r0 + r1) / 2 : r0 + ((v - d0) / (d1 - d0)) * (r1 - r0));
const hash = (str) => { let x = 0; for (const c of str) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x; };

// ------------------------------------------------------------------ persistence (per-viewer conveniences only)
const PFX = 'rentdash:' + META.key + ':';
const store = {
  get(k, d) { try { const v = localStorage.getItem(PFX + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};
const user = { starred: store.get('starred', {}), hidden: store.get('hidden', {}), notes: store.get('notes', {}) };
let compare = store.get('compare', []).filter((id) => byId.has(id));
const saveUser = () => { store.set('starred', user.starred); store.set('hidden', user.hidden); store.set('notes', user.notes); store.set('compare', compare); };

// ------------------------------------------------------------------ definitions
